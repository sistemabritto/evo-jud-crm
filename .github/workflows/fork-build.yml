name: Fork Build & Publish (Cramer)

# Gera a imagem do painel com as correções do fork e publica no Docker Hub.
# Tags: :cramer (estável) e :cramer-<sha7> (imutável, use esta no deploy).
on:
  push:
    branches: [deploy/cramer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: excarplex/evo-jud-crm

jobs:
  build:
    name: Build amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          echo "short=${GH_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=cramer-${{ steps.tags.outputs.short }}
          tags: |
            ${{ env.IMAGE_NAME }}:cramer
            ${{ env.IMAGE_NAME }}:cramer-${{ steps.tags.outputs.short }}
          cache-from: type=gha,scope=cramer-amd64
          cache-to: type=gha,scope=cramer-amd64,mode=max

      - name: Resumo
        run: |
          echo "Imagem: ${{ env.IMAGE_NAME }}:cramer-${{ steps.tags.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
